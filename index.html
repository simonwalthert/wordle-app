<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Mini Wordle</title>
  <style>
    body { font-family: Arial; text-align: center; }
    .row { display: flex; justify-content: center; margin: 5px; }
    .cell {
      width: 40px; height: 40px;
      border: 1px solid #333;
      margin: 2px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: bold;
    }
    .correct { background: green; color: white; }
    .present { background: orange; color: white; }
    .wrong { background: lightgray; }
  </style>
</head>
<body>

<h1>Mini Wordle</h1>
<input id="guess" maxlength="5" placeholder="Wort eingeben">
<button onclick="check()">Check</button>

<div id="board"></div>

<script>
const solution = "AZURE";

function check() {
  const guess = document.getElementById("guess").value.toUpperCase();
  if (guess.length !== 5) return alert("5 Buchstaben!");

  const row = document.createElement("div");
  row.className = "row";

  for (let i = 0; i < 5; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.innerText = guess[i];

    if (guess[i] === solution[i]) {
      cell.classList.add("correct");
    } else if (solution.includes(guess[i])) {
      cell.classList.add("present");
    } else {
      cell.classList.add("wrong");
    }

    row.appendChild(cell);
  }

  document.getElementById("board").appendChild(row);
}
</script>

</body>
</html>
